quarkus.application.name=curfew
quarkus.http.port=8473
quarkus.http.access-log.enabled=false

# Cliente Dynamo só é chamado no perfil prod. As chaves abaixo são fictícias
# para o SDK subir em dev e teste. Não são credencial de cliente.
quarkus.dynamodb.devservices.enabled=false
quarkus.dynamodb.sync-client.type=url
quarkus.dynamodb.aws.region=us-east-1
%dev.quarkus.dynamodb.aws.credentials.type=static
%dev.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=dev-not-a-secret
%dev.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=dev-not-a-secret
%test.quarkus.dynamodb.aws.credentials.type=static
%test.quarkus.dynamodb.aws.credentials.static-provider.access-key-id=dev-not-a-secret
%test.quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=dev-not-a-secret
%prod.quarkus.dynamodb.aws.credentials.type=default

curfew.table-name=curfew-access
curfew.scan.parallelism=4
curfew.scan.log-pause-ms=180
%test.curfew.scan.log-pause-ms=0

# auto usa a conta só quando CURFEW_GITHUB_TOKEN ou o par CURFEW_AWS_* existe.
# O teste fica no mock mesmo que a máquina tenha essas variáveis.
curfew.read.mode=auto
%test.curfew.read.mode=mock
